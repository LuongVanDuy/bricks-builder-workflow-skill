interface:
  display_name: "Bricks Builder Workflow"
  short_description: "Clone and build native Bricks sites from verified source"
  default_prompt: "Use $bricks-builder-workflow. For a live domain/clone request, inspect exact-host HTML and loaded CSS first, require evidence for primary color, font family, and content width, then generate the four Bricks 2.3.10 foundation files. Never guess brand visuals. For build work, start from the closest validated pattern, adapt it, validate once, and stop at the requested artifact."

policy:
  allow_implicit_invocation: true
